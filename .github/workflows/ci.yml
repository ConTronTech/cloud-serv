name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++ make libasio-dev libssl-dev libsqlite3-dev libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Run test suite
        run: bash tests/run.sh
