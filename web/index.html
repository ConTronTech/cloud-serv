<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>cloud-serv</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- ===== Auth view ===== -->
  <main id="auth-view" class="auth hidden">
    <div class="card auth-card">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="40" height="40" />
        <h1>cloud-serv</h1>
      </div>
      <p class="tagline">Your own private cloud.</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-register" class="tab" type="button">Register</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <label id="name-row" class="field hidden">
          <span>Display name</span>
          <input id="display-name" type="text" autocomplete="name" placeholder="optional" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="at least 8 characters" />
        </label>
        <button id="auth-submit" class="btn primary" type="submit">Log in</button>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </div>
  </main>

  <!-- ===== App view ===== -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="brand small">
        <img src="/favicon.svg" alt="" width="26" height="26" />
        <strong>cloud-serv</strong>
      </div>
      <div class="topbar-right">
        <span id="who" class="who"></span>
        <button id="logout" class="btn ghost" type="button">Log out</button>
      </div>
    </header>

    <nav class="tabbar">
      <button id="nav-files" class="navbtn active" type="button">📁 Files</button>
      <button id="nav-notes" class="navbtn" type="button">📝 Notes</button>
    </nav>

    <main class="content">
      <!-- ===== Files tab ===== -->
      <div id="files-tab">
        <section id="dropzone" class="dropzone" aria-label="Upload files">
          <input id="file-input" type="file" multiple hidden />
          <div class="dz-inner">
            <div class="dz-icon">⬆</div>
            <p><button id="pick" class="linkbtn" type="button">Choose files</button> or drag &amp; drop</p>
            <p class="muted">Uploads go straight to your server.</p>
          </div>
        </section>

        <div id="uploads" class="uploads"></div>

        <section class="files">
          <div class="files-head">
            <h2>Your files</h2>
            <button id="refresh" class="btn ghost small" type="button">Refresh</button>
          </div>
          <ul id="file-list" class="file-list"></ul>
          <p id="empty" class="muted empty hidden">No files yet. Upload something above.</p>
        </section>
      </div>

      <!-- ===== Notes tab ===== -->
      <div id="notes-tab" class="hidden">
        <section id="notes-list-view">
          <div class="files-head">
            <h2>Your notes</h2>
            <button id="new-note" class="btn primary small" type="button">＋ New note</button>
          </div>
          <ul id="note-list" class="note-list"></ul>
          <p id="notes-empty" class="muted empty hidden">No notes yet. Create one above.</p>
        </section>

        <section id="note-editor" class="hidden">
          <div class="editor-head">
            <button id="note-back" class="btn ghost small" type="button">← Back</button>
            <div class="editor-actions">
              <button id="note-delete" class="btn ghost small" type="button">Delete</button>
              <button id="note-save" class="btn primary small" type="button">Save</button>
            </div>
          </div>
          <input id="note-title" class="note-title-input" type="text" placeholder="Title" />
          <textarea id="note-body" class="note-body-input" placeholder="Write something…"></textarea>
          <p id="note-status" class="muted note-status"></p>
        </section>
      </div>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- ===== Media preview / playback ===== -->
    <div id="preview-modal" class="modal hidden" role="dialog" aria-modal="true">
      <button id="preview-close" class="modal-close" type="button" aria-label="Close">✕</button>
      <div id="preview-content" class="modal-content"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
