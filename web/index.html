<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>cloud-serv</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- ===== Auth view ===== -->
  <main id="auth-view" class="auth hidden">
    <div class="card auth-card">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="40" height="40" />
        <h1>cloud-serv</h1>
      </div>
      <p class="tagline">Your own private cloud.</p>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Log in</button>
        <button id="tab-register" class="tab" type="button">Register</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <label id="name-row" class="field hidden">
          <span>Display name</span>
          <input id="display-name" type="text" autocomplete="name" placeholder="optional" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="at least 8 characters" />
        </label>
        <button id="auth-submit" class="btn primary" type="submit">Log in</button>
        <p id="auth-error" class="error" role="alert"></p>
      </form>
    </div>
  </main>

  <!-- ===== App view ===== -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="brand small">
        <img src="/favicon.svg" alt="" width="26" height="26" />
        <strong>cloud-serv</strong>
      </div>
      <div class="topbar-right">
        <span id="who" class="who"></span>
        <button id="logout" class="btn ghost" type="button">Log out</button>
      </div>
    </header>

    <nav class="tabbar">
      <button id="nav-files" class="navbtn active" type="button">📁 Files</button>
      <button id="nav-notes" class="navbtn" type="button">📝 Notes</button>
    </nav>

    <main class="content">
      <!-- ===== Files tab (folder browser) ===== -->
      <div id="files-tab">
        <div class="fs-toolbar">
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Path"></nav>
          <div class="fs-actions">
            <button id="new-folder" class="btn ghost small" type="button">📁 New</button>
            <button id="pick" class="btn primary small" type="button">⬆ Upload</button>
            <input id="file-input" type="file" multiple hidden />
          </div>
        </div>

        <div id="home-extras">
          <div id="storage-chip" class="storage-chip"></div>
          <div class="categories">
            <button class="cat" type="button" data-cat="image"><span class="cat-ic">🖼️</span> Images</button>
            <button class="cat" type="button" data-cat="video"><span class="cat-ic">🎬</span> Videos</button>
            <button class="cat" type="button" data-cat="audio"><span class="cat-ic">🎵</span> Audio</button>
            <button class="cat" type="button" data-cat="document"><span class="cat-ic">📄</span> Docs</button>
          </div>
        </div>

        <div class="fs-controls">
          <button id="view-toggle" class="btn ghost small" type="button" title="Toggle grid/list">▦ Grid</button>
          <button id="sort-btn" class="btn ghost small" type="button" title="Sort">↕ Name ↑</button>
        </div>

        <section id="dropzone" class="dropzone" aria-label="Upload files">
          <div class="dz-inner">
            <div class="dz-icon">⬆</div>
            <p class="muted">Drop files here to upload into this folder</p>
          </div>
        </section>

        <div id="uploads" class="uploads"></div>

        <ul id="fs-list" class="fs-list"></ul>
        <p id="fs-empty" class="muted empty hidden">This folder is empty.</p>
      </div>

      <!-- ===== Notes tab ===== -->
      <div id="notes-tab" class="hidden">
        <section id="notes-list-view">
          <div class="files-head">
            <h2>Your notes</h2>
            <button id="new-note" class="btn primary small" type="button">＋ New note</button>
          </div>
          <ul id="note-list" class="note-list"></ul>
          <p id="notes-empty" class="muted empty hidden">No notes yet. Create one above.</p>
        </section>

        <section id="note-editor" class="hidden">
          <div class="editor-head">
            <button id="note-back" class="btn ghost small" type="button">← Back</button>
            <div class="editor-actions">
              <button id="note-delete" class="btn ghost small" type="button">Delete</button>
              <button id="note-save" class="btn primary small" type="button">Save</button>
            </div>
          </div>
          <input id="note-title" class="note-title-input" type="text" placeholder="Title" />
          <textarea id="note-body" class="note-body-input" placeholder="Write something…"></textarea>
          <p id="note-status" class="muted note-status"></p>
        </section>
      </div>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>

    <!-- ===== Media preview / playback ===== -->
    <div id="preview-modal" class="modal hidden" role="dialog" aria-modal="true">
      <button id="preview-close" class="modal-close" type="button" aria-label="Close">✕</button>
      <div id="preview-content" class="modal-content"></div>
    </div>

    <!-- ===== Sort ===== -->
    <div id="sort-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="sheet">
        <div class="sheet-head">
          <strong>Sort by</strong>
          <button id="sort-close" class="btn ghost small" type="button" aria-label="Close">✕</button>
        </div>
        <div id="sort-list" class="action-list"></div>
      </div>
    </div>

    <!-- ===== Per-item actions ===== -->
    <div id="action-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="sheet">
        <div class="sheet-head">
          <strong id="action-title" class="action-title"></strong>
          <button id="action-close" class="btn ghost small" type="button" aria-label="Close">✕</button>
        </div>
        <div id="action-list" class="action-list"></div>
      </div>
    </div>

    <!-- ===== Move-to folder picker ===== -->
    <div id="move-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="sheet">
        <div class="sheet-head">
          <strong>Move to…</strong>
          <button id="move-close" class="btn ghost small" type="button" aria-label="Close">✕</button>
        </div>
        <nav id="move-breadcrumbs" class="breadcrumbs"></nav>
        <ul id="move-list" class="fs-list move-list"></ul>
        <div class="sheet-actions">
          <button id="move-here" class="btn primary" type="button">Move here</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
